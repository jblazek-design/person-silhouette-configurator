<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Socialmind · Character Generator</title>
<style>
  /* Socialmind brand fonts: Mabry Pro (body), Recoleta (headings) */
  @font-face { font-family: "Mabry Pro"; src: url("fonts/MabryPro-Medium.otf") format("opentype"); font-weight: 400 700; font-display: swap; }
  @font-face { font-family: "Recoleta"; src: url("fonts/Recoleta-SemiBold.woff") format("woff"); font-weight: 400 700; font-display: swap; }
  :root {
    /* Socialmind theme tokens (socialmind.cz) */
    --bg: #EDE7FA;            /* page wash */
    --panel: #FFFFFF;
    --ink: #080015;
    --muted: #6E6A7C;
    --line: #E6DAFC;
    --neutral: #F3EDFD;
    --disabled: #DAC8FB;
    --accent: #7C21FF;
    --accent-hover: #6C19F6;
    --accent-soft: #F3EDFD;
    --accent-deep: #520BC9;
    --yellow: #FFD447;
    --topbar-h: 56px;
    --font: "Mabry Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-display: "Recoleta", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  h1, h2, h3, .wordmark { font-family: var(--font-display); font-weight: 600; letter-spacing: 0; }
  .wordmark { font-size: 17px; }
  [hidden] { display: none !important; }

  /* ================= Top bar ================= */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    height: var(--topbar-h);
    display: flex; align-items: center; gap: 14px;
    padding: 0 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    color: var(--ink);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .brand svg { width: 28px; height: 28px; display: block; }
  .brand .app-name { color: var(--muted); font-weight: 500; }
  .brand .app-name::before { content: "·"; margin: 0 6px 0 0; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  .f-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid var(--disabled); background: var(--panel); color: var(--ink);
    padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 500; cursor: pointer;
    transition: background .15s, border-color .15s, box-shadow .15s;
    line-height: 1;
  }
  .f-btn:hover { background: var(--neutral); }
  .f-btn svg { width: 16px; height: 16px; }
  .f-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .f-btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .f-btn.square { border-radius: 8px; }
  .f-btn.icon { width: 40px; height: 40px; padding: 0; }
  .f-btn:disabled { opacity: .4; cursor: default; }
  .f-btn:disabled:hover { background: var(--panel); }

  .view { display: block; }

  /* ================= Generator (Notion Faces-like) ================= */
  .faces {
    display: grid;
    grid-template-columns: 224px 340px 1fr;
    height: calc(100dvh - var(--topbar-h));
    background: var(--bg);
    color: var(--ink);
  }
  .f-cats {
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 18px 10px 14px;
    display: flex; flex-direction: column; min-height: 0;
  }
  .f-cats ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .f-cat {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 10px; border-radius: 6px; border: none; background: none; cursor: pointer;
    font-size: 14px; color: var(--ink); text-align: left;
    transition: background .12s;
  }
  .f-cat:hover { background: var(--neutral); }
  .f-cat[aria-current="true"] { background: var(--accent-soft); color: var(--accent-deep); font-weight: 600; }
  .f-cat svg { width: 18px; height: 18px; flex: 0 0 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .f-cats-foot { margin-top: auto; padding: 10px 10px 0; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
  .f-cats-foot a { color: inherit; text-decoration: none; }
  .f-cats-foot a:hover { color: var(--ink); }

  .f-drawer {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .f-drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 12px 12px 18px;
  }
  .f-drawer-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .f-iconbtn {
    width: 32px; height: 32px; border-radius: 6px; border: none; background: none; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; color: var(--ink);
  }
  .f-iconbtn:hover { background: var(--neutral); }
  .f-iconbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .f-iconbtn:disabled { opacity: .35; cursor: default; }
  .f-iconbtn:disabled:hover { background: none; }
  .f-tiles {
    display: grid; grid-template-columns: repeat(2, 1fr); grid-auto-rows: max-content; gap: 8px;
    padding: 0 16px 20px; overflow-y: auto; align-content: start;
  }
  .f-tile {
    aspect-ratio: 1 / 1; padding: 0; border-radius: 10px; overflow: hidden; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--muted);
    transition: border-color .12s, background .12s;
  }
  .f-tile:hover { border-color: #B68DF9; }
  .f-tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .f-tile svg { width: 100%; height: 100%; display: block; }

  .f-stage {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 24px; min-height: 0;
  }
  .f-history { position: absolute; top: 14px; left: 14px; display: flex; gap: 2px; align-items: center; }
  .f-history .f-iconbtn.text { width: auto; padding: 0 10px; font-size: 13px; gap: 6px; }
  .f-circle {
    width: min(460px, 64vh, 72vw); aspect-ratio: 1 / 1; border-radius: 8.85%;
    background: transparent; box-shadow: 0 2px 12px rgba(8,0,21,.06); overflow: hidden;
  }
  .f-circle svg { width: 100%; height: 100%; display: block; }
  .f-actions { display: flex; align-items: center; gap: 10px; }
  .f-actions .f-btn.primary { padding: 12px 20px; font-size: 14px; }
  .f-actions .f-btn.icon { width: 44px; height: 44px; }
  .f-toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(8px);
    background: var(--ink); color: #fff; font-size: 13px; padding: 9px 14px; border-radius: 8px;
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 50;
  }
  .f-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ================= Save flow ================= */
  .save {
    min-height: calc(100dvh - var(--topbar-h));
    background: var(--bg); color: var(--ink);
    display: flex; justify-content: center; align-items: flex-start;
    padding: 40px 20px 60px;
  }
  .save-card {
    width: min(860px, 100%); background: var(--panel);
    border-radius: 12px; box-shadow: 0 1px 3px rgba(8,0,21,.06), 0 8px 30px rgba(8,0,21,.05);
    padding: 20px 24px 28px;
  }
  .save-head { display: grid; grid-template-columns: 40px 1fr 60px; align-items: center; margin-bottom: 20px; }
  .save-head h2 { margin: 0; text-align: center; font-size: 18px; font-weight: 600; }
  .save-head .link { justify-self: end; border: none; background: none; cursor: pointer; font-size: 13px; color: var(--muted); padding: 6px; }
  .save-head .link:hover { color: var(--ink); }
  .save-step { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .save-preview {
    background: var(--neutral); border-radius: 10px; overflow: hidden; aspect-ratio: 1 / 1;
  }
  .save-preview svg { width: 100%; height: 100%; display: block; }
  .save-form { display: flex; flex-direction: column; gap: 18px; }
  .save-form label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; }
  .save-form input {
    font: inherit; font-size: 14px; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--disabled); background: var(--panel); color: var(--ink); outline: none;
  }
  .save-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .save-form .withbtn { position: relative; }
  .save-form .withbtn input { width: 100%; padding-right: 40px; }
  .save-form .withbtn .f-iconbtn { position: absolute; right: 4px; bottom: 3px; }
  .swatches { display: flex; gap: 10px; }
  .swatch {
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
    box-shadow: 0 0 0 1px rgba(8,0,21,.12) inset; padding: 0;
  }
  .swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px #fff inset; }
  .save-form .f-btn.primary { margin-top: auto; border-radius: 8px; padding: 12px; font-size: 14px; }

  .share-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .share-card h3 { margin: 12px 0 2px; font-size: 14px; font-weight: 600; }
  .share-card p { margin: 0 0 12px; font-size: 12px; color: var(--muted); }
  .share-card .row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .share-card .f-btn { border-radius: 8px; padding: 9px 14px; }
  .share-preview { border-radius: 10px; overflow: hidden; aspect-ratio: 1 / 1; background: var(--neutral); border: 1px solid var(--line); }
  .share-preview svg { width: 100%; height: 100%; display: block; }

  @media (max-width: 960px) {
    .faces { grid-template-columns: 1fr; grid-template-rows: 1fr auto auto; }
    .f-stage { order: 1; gap: 16px; padding: 16px; }
    .f-history { top: 8px; left: 8px; }
    .f-circle { width: min(300px, 40vh, 70vw); }
    .f-drawer { order: 2; border-right: none; border-top: 1px solid var(--line); max-height: 36vh; }
    .f-tiles { grid-template-columns: repeat(4, 1fr); }
    .f-cats { order: 3; border-right: none; border-top: 1px solid var(--line); padding: 8px; flex-direction: row; }
    .f-cats ul { flex-direction: row; overflow-x: auto; gap: 2px; width: 100%; }
    .f-cat { flex-direction: column; gap: 4px; font-size: 11px; padding: 8px 10px; white-space: nowrap; }
    .f-cats-foot { display: none; }
    .save { padding: 16px 12px 40px; }
    .save-step, .share-cards { grid-template-columns: 1fr; }
  }
  @media (max-width: 540px) {
    .f-tiles { grid-template-columns: repeat(3, 1fr); }
    .brand .app-name { display: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span id="brandMark" aria-hidden="true"></span>
    <span class="wordmark">Socialmind</span>
    <span class="app-name">Character Generator</span>
  </div>
  <div class="topbar-right">
    <button class="f-btn" id="saveBtn">Save <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></button>
  </div>
</header>

<!-- ================= Generator ================= -->
<section class="view faces" id="view-portrait">
  <nav class="f-cats" aria-label="Categories">
    <ul id="catList"></ul>
    <div class="f-cats-foot">
      <a href="https://github.com/jblazek-design/person-silhouette-configurator" target="_blank" rel="noopener">Source on GitHub</a>
      <span>Illustrations · Socialmind</span>
    </div>
  </nav>

  <aside class="f-drawer" aria-live="polite">
    <div class="f-drawer-head">
      <h2 id="drawerTitle">Eyes</h2>
      <button class="f-iconbtn" id="catShuffle" title="Randomise this category" aria-label="Randomise this category">
        <svg viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/></svg>
      </button>
    </div>
    <div class="f-tiles" id="tiles"></div>
  </aside>

  <main class="f-stage">
    <div class="f-history">
      <button class="f-iconbtn" id="undoBtn" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="f-iconbtn" id="redoBtn" title="Redo" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button class="f-iconbtn text" id="clearBtn" title="Clear all"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>Clear all</button>
    </div>

    <div class="f-circle" id="portraitPreview"></div>

    <div class="f-actions">
      <button class="f-btn icon" id="shuffleAll" title="Shuffle everything" aria-label="Shuffle everything">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/></svg>
      </button>
      <button class="f-btn primary" id="newPortrait">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New character
      </button>
    </div>
  </main>
  <div class="f-toast" id="toast" role="status"></div>
</section>

<!-- ================= Save flow ================= -->
<section class="view save" id="view-save" hidden>
  <div class="save-card">
    <div class="save-head">
      <button class="f-iconbtn" id="saveBack" title="Back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button>
      <h2 id="saveTitle">Customise your character</h2>
      <button class="link" id="saveSkip">Skip ›</button>
    </div>

    <div class="save-step" id="saveStep1">
      <div class="save-preview" id="cardPreview"></div>
      <div class="save-form">
        <label>Headline
          <input id="cardName" type="text" placeholder="Name (optional)" maxlength="40" autocomplete="off">
        </label>
        <label>Caption
          <div class="withbtn">
            <input id="cardCaption" type="text" placeholder="Proudest of ___" maxlength="60" autocomplete="off">
            <button class="f-iconbtn" id="captionShuffle" title="Shuffle caption" aria-label="Shuffle caption" type="button"><svg viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/></svg></button>
          </div>
        </label>
        <div>
          <div style="font-size:13px;font-weight:500;margin-bottom:8px">Background</div>
          <div class="swatches" id="bgSwatches"></div>
        </div>
        <button class="f-btn primary" id="saveContinue">Continue</button>
      </div>
    </div>

    <div class="share-cards" id="saveStep2" hidden>
      <div class="share-card">
        <div class="share-preview" id="shareCard"></div>
        <h3>Customised</h3>
        <p>For sharing on social media</p>
        <div class="row-btns">
          <button class="f-btn primary" data-dl="card-png">Download PNG</button>
          <button class="f-btn" data-dl="card-svg">SVG</button>
        </div>
      </div>
      <div class="share-card">
        <div class="share-preview" id="sharePortrait"></div>
        <h3>Character only</h3>
        <p>Perfect for profile photos</p>
        <div class="row-btns">
          <button class="f-btn primary" data-dl="portrait-png">Download PNG</button>
          <button class="f-btn" data-dl="portrait-svg">SVG</button>
          <button class="f-btn" data-dl="portrait-copy">Copy SVG</button>
        </div>
      </div>
    </div>
  </div>
</section>

<script src="parts.js"></script>
<script>
// =====================================================================
// Socialmind character generator — layered illustration parts
// (1:1 port of the Peeple "Portrait" tab, Socialmind "Characters factory" assets)
// =====================================================================
(function () {
  const P = window.SM_PARTS;
  const $ = (id) => document.getElementById(id);

  const INK = P.ink;
  const F = P.frame;           // 800 — every part is drawn in this frame
  const NS = 'http://www.w3.org/2000/svg';
  let idSeq = 0;

  // icons (24 grid, stroke)
  const ICONS = {
    shape: '<svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 0 0 16 0c0-1.6-.5-3.2-1.3-4.5A8 8 0 0 1 12 8a8 8 0 0 1-6.7-3.5A8 8 0 0 0 4 9Z"/></svg>',
    tone: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18"/><circle cx="8.5" cy="10" r=".8" fill="currentColor"/><circle cx="12" cy="7" r=".8" fill="currentColor"/><circle cx="8" cy="14.5" r=".8" fill="currentColor"/></svg>',
    legs: '<svg viewBox="0 0 24 24"><path d="M9 4v10l-2 6"/><path d="M15 4v10l2 6"/><path d="M5 20h3"/><path d="M16 20h3"/></svg>',
    eyes: '<svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>',
    hands: '<svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M11 10V4.5a1.5 1.5 0 0 1 3 0V11"/><path d="M14 11V6.5a1.5 1.5 0 0 1 3 0V13"/><path d="M8 13l-1.6-2.4a1.5 1.5 0 0 0-2.5 1.6L7 17c1.5 3 3.5 4 6.5 4 3.5 0 6-2.5 6-6.5V13"/></svg>',
    hat: '<svg viewBox="0 0 24 24"><path d="M6 14V9a6 6 0 0 1 12 0v5"/><path d="M3 15h18"/><path d="M4 15c2 3 14 3 16 0"/></svg>',
    pet: '<svg viewBox="0 0 24 24"><circle cx="7" cy="8" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="17" cy="8" r="2"/><path d="M12 11c-3 0-6 3-6 6 0 2 1.5 3 3 3 1.2 0 2-.5 3-.5s1.8.5 3 .5c1.5 0 3-1 3-3 0-3-3-6-6-6Z"/></svg>',
    none: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m6.5 6.5 11 11"/></svg>'
  };

  const CATS = [
    { key: 'shape', label: 'Shape',  optional: false },
    { key: 'tone',  label: 'Colour', optional: false },
    { key: 'legs',  label: 'Legs',   optional: true, noneChance: 0.15 },
    { key: 'eyes',  label: 'Eyes',   optional: true, noneChance: 0.03 },
    { key: 'hat',   label: 'Hat',    optional: true, noneChance: 0.5 },
    { key: 'hands', label: 'Hands',  optional: true, noneChance: 0.35 },
    { key: 'pet',   label: 'Pets',   optional: true, noneChance: 0.6 }
  ];
  const PART_CATS = CATS.filter(c => c.optional).map(c => c.key);
  // draw order: back → front. Pets always stay on top.
  // A part flagged 'back' (part.layer, from a "- Back" file name at build time) is drawn
  // behind the body shape; "- Front" is the normal position of its category.
  const LAYERS = ['legs', 'eyes', 'hat', 'hands', 'pet'];
  const slotOf = (part) => (part.layer === 'back' ? 'back' : 'mid');
  // the colour the arms were drawn in — default body colour
  const DEFAULT_TONE = Math.max(0, P.tones.indexOf(P.body));

  const BGS = [
    { key: 'lavender', label: 'Lavender', color: '#EDE7FA', text: INK },
    { key: 'purple',   label: 'Purple',   color: '#7C21FF', text: '#FFFFFF' },
    { key: 'yellow',   label: 'Yellow',   color: '#FFD447', text: INK },
    { key: 'white',    label: 'White',    color: '#FFFFFF', text: INK },
    { key: 'dark',     label: 'Dark',     color: '#080015', text: '#FFFFFF' }
  ];
  const CAPTIONS = [
    'Proudest of ___', 'Currently obsessed with ___', 'Ask me about ___', 'Known for ___',
    'Working on ___', 'Can\'t live without ___', 'Secretly good at ___', 'Team ___'
  ];

  // ---- state ----
  const state = { shape: 1, tone: DEFAULT_TONE, legs: 1, eyes: 1, hands: 0, hat: 0, pet: 0 };
  const card = { name: '', caption: '', bg: 'lavender' };
  let activeCat = 'eyes';
  let history = [], future = [];

  // ---- helpers ----
  const rnd = (n) => Math.floor(Math.random() * n);
  const partOf = (cat, n) => (n > 0 ? P.parts[cat][n - 1] : null);
  // Parts can be drawn for one base shape only (part.fit, 1-based, from a "- Shape N" file
  // name); untagged parts fit every shape.
  const fits = (part, shape) => !part.fit || part.fit === shape + 1;
  const fittingIdx = (cat, shape) => P.parts[cat].map((p, i) => (fits(p, shape) ? i + 1 : 0)).filter(Boolean);
  const specificIdx = (cat, shape) => P.parts[cat].map((p, i) => (p.fit === shape + 1 ? i + 1 : 0)).filter(Boolean);
  // Same style for another shape: first the same Figma number drawn for the new shape (hats
  // exist once per shape), then the k-th shape-specific part of the old shape → the k-th of
  // the new one (legs). Falls back to a general part, then to the first fitting one, then none.
  function refit(cat, n, fromShape, toShape) {
    if (!n || fits(partOf(cat, n), toShape)) return n;
    const cur = partOf(cat, n);
    const sameNumber = P.parts[cat].findIndex(p => p.n === cur.n && fits(p, toShape));
    if (sameNumber >= 0) return sameNumber + 1;
    if (fromShape != null) {
      const pos = specificIdx(cat, fromShape).indexOf(n);
      const same = pos >= 0 ? specificIdx(cat, toShape)[pos] : undefined;
      if (same) return same;
    }
    const general = fittingIdx(cat, toShape).find(i => !partOf(cat, i).fit);
    return general || fittingIdx(cat, toShape)[0] || 0;
  }
  // Every part carries __ID__-prefixed ids (clip paths, masks, gradients) and __SKIN__ fills;
  // the same part is on screen several times, so ids get a per-instance prefix.
  function layer(svg, prefix, skin) {
    return svg.replace(/__ID__/g, prefix).replace(/__SKIN__/g, skin);
  }
  function base(shape, tone) { return `<path d="${P.shapes[shape].d}" fill="${P.tones[tone]}"/>`; }

  function portraitBody(st, prefix) {
    const picked = LAYERS.map(cat => [cat, partOf(cat, st[cat])]).filter(([, part]) => part);
    const draw = (slot) => picked
      .filter(([, part]) => slotOf(part) === slot)
      .map(([cat, part]) => layer(part.svg, `${prefix}${cat}-`, P.tones[st.tone]))
      .join('');
    return draw('back') + base(st.shape, st.tone) + draw('mid');
  }

  // Light tones sit on a tinted background so the body stays visible.
  const RADIUS = Math.round(F * 0.0885); // corner radius in viewBox units
  const LIGHT_BG = '#CDB4FA';
  function bgFor(tone) { return tone <= 1 ? LIGHT_BG : '#FFFFFF'; }

  // Full portrait SVG: rounded square. opts: { bg, size, radius }
  function portraitSvg(st, opts = {}) {
    const size = opts.size ? `width="${opts.size}" height="${opts.size}"` : '';
    const bg = opts.bg || bgFor(st.tone);
    const r = opts.radius == null ? RADIUS : opts.radius;
    const prefix = 'p' + (++idSeq) + '-';
    const cid = prefix + 'clip';
    const clip = `<defs><clipPath id="${cid}"><rect width="${F}" height="${F}" rx="${r}"/></clipPath></defs>`;
    return `<svg xmlns="${NS}" viewBox="0 0 ${F} ${F}" ${size}>${clip}<g clip-path="url(#${cid})"><rect width="${F}" height="${F}" fill="${bg}"/>${portraitBody(st, prefix)}</g></svg>`;
  }

  // Tiles: base tiles crop to the body area, part tiles crop to the part (measured once)
  // and show the current shape as a ghost for context.
  const BASE_CROP = `${F * 0.15} ${F * 0.15} ${F * 0.7} ${F * 0.7}`;
  const GHOST = '#E7E3EF';
  function tileSvg(cat, n) {
    if (cat === 'shape') {
      return `<svg xmlns="${NS}" viewBox="${BASE_CROP}">${base(n, state.tone)}</svg>`;
    }
    if (cat === 'tone') {
      const bg = n <= 1 ? `<rect width="${F}" height="${F}" fill="${LIGHT_BG}"/>` : '';
      return `<svg xmlns="${NS}" viewBox="${BASE_CROP}">${bg}${base(state.shape, n)}</svg>`;
    }
    const part = partOf(cat, n);
    const crop = part.crop || `0 0 ${F} ${F}`;
    const ghost = `<path d="${P.shapes[state.shape].d}" fill="${GHOST}"/>`;
    const art = layer(part.svg, `t${n}-`, GHOST);
    // back-slot parts sit behind the ghost body, like on the stage
    return `<svg xmlns="${NS}" viewBox="${crop}">${slotOf(part) === 'back' ? art + ghost : ghost + art}</svg>`;
  }

  // Measure each part's bounding box once (hidden SVG) → square crop for its tile.
  function measureParts() {
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', `0 0 ${F} ${F}`);
    svg.setAttribute('width', F); svg.setAttribute('height', F);
    svg.style.cssText = 'position:absolute;left:-10000px;top:0;visibility:hidden;pointer-events:none';
    const g = document.createElementNS(NS, 'g');
    svg.appendChild(g);
    document.body.appendChild(svg);
    const MIN = F * 0.45, PAD = F * 0.05;
    for (const cat of PART_CATS) {
      for (const part of P.parts[cat]) {
        g.innerHTML = layer(part.svg, 'm-', INK);
        let b = null;
        try { b = g.getBBox(); } catch (_) { /* no layout */ }
        if (!b || !b.width || !b.height) { part.crop = `0 0 ${F} ${F}`; continue; }
        let size = Math.min(F, Math.max(MIN, Math.max(b.width, b.height) + PAD * 2));
        let x = b.x + b.width / 2 - size / 2;
        let y = b.y + b.height / 2 - size / 2;
        x = Math.min(Math.max(x, 0), F - size);
        y = Math.min(Math.max(y, 0), F - size);
        part.crop = [x, y, size, size].map(v => Math.round(v)).join(' ');
      }
    }
    svg.remove();
  }

  // Social card: 1080x1080, coloured background, rounded portrait, name + caption.
  // fontStyle: optional <style> with embedded @font-face rules (exports only — an SVG
  // rasterised through <img> cannot load external font files).
  function cardSvg(st, c, size, fontStyle) {
    const bg = BGS.find(b => b.key === c.bg) || BGS[0];
    const name = escapeXml(c.name.trim());
    const caption = escapeXml(c.caption.trim());
    const hasText = name || caption;
    const r = hasText ? 300 : 360;
    const cy = hasText ? 440 : 540;
    const portrait = portraitSvg(st)
      .replace('<svg ', `<svg x="${540 - r}" y="${cy - r}" width="${r * 2}" height="${r * 2}" `);
    const fontHead = `font-family="Recoleta, Georgia, serif"`;
    const fontBody = `font-family="Mabry Pro, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"`;
    const text = hasText ? `
      ${name ? `<text x="540" y="${caption ? 850 : 880}" text-anchor="middle" ${fontHead} font-size="60" font-weight="600" fill="${bg.text}">${name}</text>` : ''}
      ${caption ? `<text x="540" y="${name ? 920 : 880}" text-anchor="middle" ${fontBody} font-size="34" font-weight="500" fill="${bg.text}" opacity="0.85">${caption}</text>` : ''}` : '';
    const fonts = hasText && fontStyle ? fontStyle : '';
    const sizeAttr = size ? `width="${size}" height="${size}"` : '';
    const haloR = (r + 10) * 2 * RADIUS / F;
    return `<svg xmlns="${NS}" viewBox="0 0 1080 1080" ${sizeAttr}>${fonts}<rect width="1080" height="1080" fill="${bg.color}"/><rect x="${540 - r - 10}" y="${cy - r - 10}" width="${r * 2 + 20}" height="${r * 2 + 20}" rx="${haloR}" fill="#FFFFFF" opacity="0.35"/>${portrait}${text}</svg>`;
  }
  function escapeXml(s) { return s.replace(/[<>&"']/g, ch => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&#39;' }[ch])); }

  // ---- history ----
  function commit(patch) {
    history.push({ ...state });
    if (history.length > 100) history.shift();
    future = [];
    const next = { ...state, ...patch };
    if (next.shape !== state.shape) {
      // keep the character consistent: parts drawn for the old shape switch to their counterpart
      for (const cat of PART_CATS) if (!(cat in patch)) next[cat] = refit(cat, state[cat], state.shape, next.shape);
    }
    Object.assign(state, next);
    render();
  }
  function undo() { if (!history.length) return; future.push({ ...state }); Object.assign(state, history.pop()); render(); }
  function redo() { if (!future.length) return; history.push({ ...state }); Object.assign(state, future.pop()); render(); }

  // ---- randomisation ----
  function randomPart(cat, shape = state.shape) {
    const c = CATS.find(x => x.key === cat);
    const pool = fittingIdx(cat, shape);
    if (!pool.length) return 0;
    if (c.optional && Math.random() < c.noneChance) return 0;
    return pool[rnd(pool.length)];
  }
  function randomAll(includeBase) {
    const patch = {};
    if (includeBase) { patch.shape = rnd(P.shapes.length); patch.tone = rnd(P.tones.length); }
    const shape = includeBase ? patch.shape : state.shape;
    for (const cat of PART_CATS) patch[cat] = randomPart(cat, shape);
    // a body without eyes looks unfinished — force eyes
    if (!patch.eyes) { const pool = fittingIdx('eyes', shape); patch.eyes = pool[rnd(pool.length)] || 0; }
    return patch;
  }

  // ---- URL state ----
  const KEYS = ['shape', 'tone', ...PART_CATS];
  function encodeState() { return KEYS.map(k => state[k]).join('.'); }
  function decodeState(code) {
    const nums = String(code || '').split('.').map(n => parseInt(n, 10));
    if (nums.length !== KEYS.length || nums.some(n => Number.isNaN(n))) return null;
    const clamp = (v, max) => Math.min(Math.max(v, 0), max);
    const out = { shape: clamp(nums[0], P.shapes.length - 1), tone: clamp(nums[1], P.tones.length - 1) };
    PART_CATS.forEach((k, i) => { out[k] = refit(k, clamp(nums[i + 2], P.parts[k].length), null, out.shape); });
    return out;
  }

  // ---- rendering ----
  function render() {
    $('portraitPreview').innerHTML = portraitSvg(state);
    renderTiles();
    $('undoBtn').disabled = history.length === 0;
    $('redoBtn').disabled = future.length === 0;
    if (currentView === 'portrait') syncHash();
  }

  function renderCats() {
    const ul = $('catList');
    ul.innerHTML = '';
    for (const c of CATS) {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.className = 'f-cat';
      b.innerHTML = ICONS[c.key] + '<span>' + c.label + '</span>';
      b.setAttribute('aria-current', String(c.key === activeCat));
      b.addEventListener('click', () => { activeCat = c.key; renderCats(); renderTiles(); });
      li.appendChild(b);
      ul.appendChild(li);
    }
    $('drawerTitle').textContent = CATS.find(c => c.key === activeCat).label;
  }

  function renderTiles() {
    const wrap = $('tiles');
    wrap.innerHTML = '';
    const cat = CATS.find(c => c.key === activeCat);
    const isBase = !cat.optional;
    const count = cat.key === 'shape' ? P.shapes.length : cat.key === 'tone' ? P.tones.length : P.parts[cat.key].length;
    const frag = document.createDocumentFragment();
    const mk = (n, label) => {
      const b = document.createElement('button');
      b.className = 'f-tile';
      b.type = 'button';
      b.setAttribute('aria-pressed', String(state[cat.key] === n));
      b.setAttribute('aria-label', label);
      b.title = label;
      b.addEventListener('click', () => { if (state[cat.key] !== n) commit({ [cat.key]: n }); });
      return b;
    };
    if (cat.optional) {
      const none = mk(0, 'None');
      none.textContent = 'None';
      frag.appendChild(none);
    }
    // base categories list every option; part categories only what fits the current shape
    const idx = isBase ? Array.from({ length: count }, (_, i) => i) : fittingIdx(cat.key, state.shape);
    for (const n of idx) {
      const t = mk(n, `${cat.label} ${isBase ? n + 1 : n}`);
      t.innerHTML = tileSvg(cat.key, n);
      frag.appendChild(t);
    }
    wrap.appendChild(frag);
    $('drawerTitle').textContent = cat.label;
  }

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  }

  // ---- export helpers ----
  function download(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function svgToPng(svg, size) {
    return new Promise((resolve, reject) => {
      const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = c.height = size;
        c.getContext('2d').drawImage(img, 0, 0, size, size);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/png');
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('svg load failed')); };
      img.src = url;
    });
  }
  const slug = () => 'socialmind-' + encodeState().replace(/\./g, '-');

  // Brand fonts embedded as data URIs for the card exports (fetched once, cached).
  const FONTS = [
    { family: 'Recoleta',  file: 'fonts/Recoleta-SemiBold.woff', format: 'woff',     mime: 'font/woff' },
    { family: 'Mabry Pro', file: 'fonts/MabryPro-Medium.otf',    format: 'opentype', mime: 'font/otf' }
  ];
  let fontCssPromise = null;
  function fontCss() {
    if (!fontCssPromise) {
      fontCssPromise = Promise.all(FONTS.map(async (f) => {
        const res = await fetch(f.file);
        if (!res.ok) throw new Error('font not found: ' + f.file);
        const bytes = new Uint8Array(await res.arrayBuffer());
        let bin = '';
        for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        return `@font-face{font-family:'${f.family}';font-weight:400 700;src:url(data:${f.mime};base64,${btoa(bin)}) format('${f.format}')}`;
      })).then(rules => `<style>${rules.join('')}</style>`)
        .catch(err => { console.warn(err); return ''; });
    }
    return fontCssPromise;
  }

  // ---- save flow ----
  let saveStep = 1;
  function openSave() {
    saveStep = 1;
    showView('save');
    renderSave();
  }
  function renderSave() {
    $('saveStep1').hidden = saveStep !== 1;
    $('saveStep2').hidden = saveStep !== 2;
    $('saveTitle').textContent = saveStep === 1 ? 'Customise your character' : 'Download and share';
    $('saveSkip').hidden = saveStep !== 1;
    if (saveStep === 1) {
      $('cardName').value = card.name;
      $('cardCaption').value = card.caption;
      $('cardPreview').innerHTML = cardSvg(state, card);
      const sw = $('bgSwatches');
      sw.innerHTML = '';
      for (const b of BGS) {
        const s = document.createElement('button');
        s.className = 'swatch'; s.type = 'button';
        s.style.background = b.color;
        s.title = b.label; s.setAttribute('aria-label', b.label);
        s.setAttribute('aria-pressed', String(card.bg === b.key));
        s.addEventListener('click', () => { card.bg = b.key; renderSave(); });
        sw.appendChild(s);
      }
    } else {
      $('shareCard').innerHTML = cardSvg(state, card);
      $('sharePortrait').innerHTML = portraitSvg(state);
    }
  }
  $('cardName').addEventListener('input', e => { card.name = e.target.value; $('cardPreview').innerHTML = cardSvg(state, card); });
  $('cardCaption').addEventListener('input', e => { card.caption = e.target.value; $('cardPreview').innerHTML = cardSvg(state, card); });
  $('captionShuffle').addEventListener('click', () => {
    const others = CAPTIONS.filter(c => c !== card.caption);
    card.caption = others[rnd(others.length)];
    $('cardCaption').value = card.caption;
    $('cardPreview').innerHTML = cardSvg(state, card);
  });
  $('saveContinue').addEventListener('click', () => { saveStep = 2; renderSave(); });
  $('saveSkip').addEventListener('click', () => { saveStep = 2; renderSave(); });
  $('saveBack').addEventListener('click', () => {
    if (saveStep === 2) { saveStep = 1; renderSave(); }
    else showView('portrait');
  });
  $('saveStep2').addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-dl]');
    if (!btn) return;
    const kind = btn.dataset.dl;
    try {
      if (kind === 'card-png') download(await svgToPng(cardSvg(state, card, 1080, await fontCss()), 1080), slug() + '-card.png');
      if (kind === 'card-svg') download(new Blob([cardSvg(state, card, 0, await fontCss())], { type: 'image/svg+xml' }), slug() + '-card.svg');
      if (kind === 'portrait-png') download(await svgToPng(portraitSvg(state, { size: 1024 }), 1024), slug() + '.png');
      if (kind === 'portrait-svg') download(new Blob([portraitSvg(state)], { type: 'image/svg+xml' }), slug() + '.svg');
      if (kind === 'portrait-copy') {
        await navigator.clipboard.writeText(portraitSvg(state));
        const orig = btn.textContent; btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = orig, 1200);
      }
    } catch (err) {
      console.error(err);
      alert('Export failed: ' + err.message);
    }
  });

  // ---- generator controls ----
  $('catShuffle').addEventListener('click', () => {
    const cat = activeCat;
    let n;
    if (cat === 'shape') { do { n = rnd(P.shapes.length); } while (n === state.shape && P.shapes.length > 1); }
    else if (cat === 'tone') { do { n = rnd(P.tones.length); } while (n === state.tone && P.tones.length > 1); }
    else {
      // anything fitting the current shape except the current pick (None counts as an option)
      const c = CATS.find(x => x.key === cat);
      const pool = (c.optional ? [0] : []).concat(fittingIdx(cat, state.shape)).filter(i => i !== state[cat]);
      if (!pool.length) return;
      n = pool[rnd(pool.length)];
    }
    commit({ [cat]: n });
  });
  $('shuffleAll').addEventListener('click', () => commit(randomAll(false)));
  $('newPortrait').addEventListener('click', () => commit(randomAll(true)));
  $('undoBtn').addEventListener('click', undo);
  $('redoBtn').addEventListener('click', redo);
  $('clearBtn').addEventListener('click', () => commit({ legs: 0, eyes: 0, hands: 0, hat: 0, pet: 0 }));
  $('saveBtn').addEventListener('click', openSave);

  document.addEventListener('keydown', (e) => {
    if (currentView !== 'portrait') return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (!mod && e.key.toLowerCase() === 'r') { commit(randomAll(false)); }
  });

  // ---- views ----
  let currentView = 'portrait';
  const views = { portrait: $('view-portrait'), save: $('view-save') };
  function showView(name) {
    for (const k in views) views[k].hidden = k !== name;
    currentView = name;
    $('saveBtn').hidden = name !== 'portrait';
    syncHash();
    window.scrollTo(0, 0);
  }
  function syncHash() {
    const h = '#' + encodeState();
    if (location.hash !== h) { try { window.history.replaceState(null, '', h); } catch (_) { location.hash = h; } }
  }
  function applyHash() {
    const st = decodeState(location.hash.slice(1));
    if (st) Object.assign(state, st);
    else Object.assign(state, randomAll(true));
  }
  window.addEventListener('hashchange', () => { applyHash(); render(); });

  // ---- brand mark: the base shape with eyes ----
  $('brandMark').innerHTML = `<svg viewBox="140 200 520 400" aria-hidden="true"><path d="${P.shapes[1].d}" fill="#7C21FF"/><circle cx="352" cy="430" r="30" fill="${INK}"/><circle cx="448" cy="430" r="30" fill="${INK}"/></svg>`;

  // ---- init ----
  measureParts();
  applyHash();
  renderCats();
  render();
})();
</script>
</body>
</html>
